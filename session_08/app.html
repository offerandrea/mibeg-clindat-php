<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taschenrechner</title>
    <style>
    
        button {
            font-size: 5em
        }

    </style>
</head>
<body>
    <h1>Counter App</h1>


<!-- Zahlenfelder 1 bis 9 und +,-,*,/,.,=, C=Löschen(einzelne Buttons oder 2 Auswahlfelder (const input = document.querySelector ("#inc");), 
Display wiedergabe Zahlen-, Operator-Eingabe(onst input = document.querySelector ("#inc");)
Display Ergebnis (const output = document.querySelector("#currentNum");)


    <div>
        <p> Zählstand: <span id="currentNum">0</span></p>
        <input type="number" value="1" id="inc">
        <button id="btn1">
            
          🐬
        </button>

    </div>

  <script>
    // 0: Zustand, welche Daten muss die APP handhaben
      let num = 0;
      let increment = 1;


    //1: Womit soll etwas passieren?
    const btn = document.querySelector("#btn1");
    const output = document.querySelector("#currentNum");
    const input = document.querySelector ("#inc");
  
    //2: Was soll passieren?
    function whenButtonClicked() {
        //num = num + 1;
        //num = num +=1 ;
        //num++;
        increment = Number(input.value);
        num += increment;

        //btn.textContent = num;
        output.textContent = num;
    }
    
    //3: Es passiert sobald...
    btn.addEventListener (
        "click",
         whenButtonClicked
    );

  </script>    
</body>
</html>
